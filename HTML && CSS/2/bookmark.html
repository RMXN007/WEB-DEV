<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Bookmarks for mostb used websites.</h1>
    <ul>
        <li type="1"><a href="https://www.google.com" target="_blank">Google</a></li>
        <li type="1"><a href="https://www.github.com" target="_blank">GitHub</a></li>
        <li type="1"><a href="https://www.stackoverflow.com" target="_blank">Stack Overflow</a></li>
        <li type="1"><a href="https://www.reddit.com" target="_blank">Reddit</a></li>
        <li type="1"><a href="https://www.wikipedia.org" target="_blank">Wikipedia</a></li>

        <form action="post">
            <div>   
            <label for="username">Enter your username</label>
            <input type="text" name="username" placeholder="Enter your name" required autofocus>
            </div>

            <div>
            <input type="radio" name="gender" id="male">
             <label for="male">Male</label>   
            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>
            </div>

            <div>
                <label for="comment">Enter your comment</label>
                <br>
                <textarea name="comment" id="comment" placeholder="text" rows="5" cols="50"></textarea>
            </div>

            <div>
                <select name="fruits" id="">
                    <option value="apple">Apple</option>
                    <option value="banana">Banana</option>
                </select>
            </div>
        </form>

    <script src="script.js"></script>
</body>
</html>
