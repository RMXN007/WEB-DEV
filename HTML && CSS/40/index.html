<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        .container {
            /* display: flex;
            align-items: center;
            flex-wrap: wrap; */
            border: 2px solid black;
            display: grid;
            grid-template-columns: 100px 100px 100px 100px;
            gap: 10px;
            align-items: center;
            justify-content: center;
            height:80vh;
        }

        .box {
            display: flex;
            padding: 5px;
            margin: 5px;
            box-sizing: border-box;
            border: 2px solid rgba(0, 255, 255, 0.715);
            background-color: rgba(0, 255, 255, 0.715);
            height: 60px;
            width: 60px;
            align-items: center;
            justify-content: center;
        }

        .box1:hover {
            transform: rotateX(45deg);
        }

        .box2:hover {
            transform: scale(1.5);
            /* only for X and Y*/
        }
        .box3:hover {
            transform: translate(50%);
            /* only for X and Y*/
        }
        .box4:hover {
            transform: rotate(50deg);
            /*For X,Y and Z*/
        }
        .box5:hover{
            transform: scaleX(2.0);
        }
        </style>
</head>

<body>
    <div class="container">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
        <div class="box box4">4</div>
        <div class="box box5">5</div>
        <div class="box box6">6</div>
        <div class="box box7">7</div>
        <div class="box box8">8</div>
        <div class="box box9">9</div>
        <div class="box box10">10</div>
        <div class="box box11">11</div>
        <div class="box box12">12</div>
        <div class="box box13">13</div>
        <div class="box box14">14</div>
        <div class="box box15">15</div>
        <div class="box box16">16</div>
    </div>
</body>

</html>
