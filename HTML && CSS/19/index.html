<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS TEXT DETAILS</title>
    <style>
        *{
            border: solid rgb(0, 0, 0);
        }
        h1{
            text-align: center;
            text-overflow: ellipsis;
            font-weight:bold;
            font-family: system-ui, -apple-system;
            font-size:larger;
            text-decoration: underline;
            background-color: aliceblue;
            color: navy;
            border: solid black;
        }
        h2{
            /* Removed invalid font-display property */
        }
        p{
            /* text-shadow requires offset and blur, not just color */
            text-shadow: 1px 1px 2px rgb(139, 19, 19);
            text-transform: capitalize;
            text-indent: 2px;
            text-decoration-color: rgb(0, 255, 255);
            /* Removed incomplete property 'te' */
        }
    </style>
</head>
<body>
    <h1>CSS TEXT CLASS</h1>
    <h2>ABOUT CSS</h2>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolor ducimus odit debitis mollitia delectus quibusdam possimus. Labore quo autem corporis? Voluptatum, soluta.</p>
</body>
</html>
